name: Cockpit Keep-Alive Cron

on:
  schedule:
    # Run every 10 minutes 24/7 to prevent Render Free Tier 15-minute inactivity spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Render URL to ping (e.g., https://your-app.onrender.com)'
        required: false
        default: ''

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Cockpit Heartbeat
        env:
          DEFAULT_URL: "https://autonomous-trading-cockpit-8wal.onrender.com"
          SECRET_URL: ${{ secrets.RENDER_APP_URL || secrets.KOYEB_APP_URL }}
          INPUT_URL: ${{ github.event.inputs.target_url }}
        run: |
          TARGET="${INPUT_URL:-${SECRET_URL:-$DEFAULT_URL}}"
          TARGET="${TARGET%/}"
          echo "Target URL: $TARGET"
          echo "Pinging $TARGET/heartbeat at $(date -u)..."
          HTTP_STATUS=$(curl -s -o /tmp/heartbeat_res.txt -w "%{http_code}" -m 35 "$TARGET/heartbeat" || true)
          HTTP_STATUS="${HTTP_STATUS:-000}"

          if [ "$HTTP_STATUS" -ge 200 ] 2>/dev/null && [ "$HTTP_STATUS" -lt 400 ] 2>/dev/null; then
            echo "Success! HTTP $HTTP_STATUS"
            cat /tmp/heartbeat_res.txt
          else
            echo "Heartbeat returned $HTTP_STATUS, attempting fallback to root URL..."
            sleep 3
            HTTP_STATUS_ROOT=$(curl -s -o /tmp/root_res.txt -w "%{http_code}" -m 35 "$TARGET/heartbeat" || true)
            echo "Retry heartbeat ping returned: $HTTP_STATUS_ROOT"
            cat /tmp/root_res.txt || true
          fi
