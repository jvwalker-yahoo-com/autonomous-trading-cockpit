name: autonomous-trading-cockpit
services:
  - name: web
    git:
      repository: github.com/jvwalker-yahoo-com/autonomous-trading-cockpit
      branch: main
      build_command: pip install -r requirements.txt
      run_command: uvicorn backend.server:app --host 0.0.0.0 --port 8000
    instance_type: nano
    regions:
      - fra
    ports:
      - port: 8000
        protocol: http
    routes:
      - path: /
        port: 8000
