services:
  - type: web
    name: autonomous-trading-cockpit
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EXECUTION_MODE
        value: "live"
      - key: SIMULATION_MODE
        value: "false"
      - key: INITIAL_CAPITAL
        value: "1300.0"
      - key: MAX_CONCURRENT_POSITIONS
        value: "15"
      - key: MAX_DRAWDOWN_LIMIT_PCT
        value: "0.15"
      - key: MAX_PORTFOLIO_EXPOSURE_PCT
        value: "0.85"
      - key: MAX_POSITION_SIZE_USD
        value: "250.0"
      - key: MIN_CONVICTION_SCORE
        value: "0.08"
      - key: DEFAULT_STOP_LOSS_PCT
        value: "0.025"
      - key: DEFAULT_TAKE_PROFIT_PCT
        value: "0.050"
      - key: ENABLE_DAY_TRADING
        value: "true"
      - key: DAY_TRADE_ALLOCATION_PCT
        value: "0.50"
      - key: DAY_TRADE_MAX_ACTIVE
        value: "8"
      - key: EXECUTION_LOOP_INTERVAL
        value: "5.0"
      - key: DAY_TRADE_STOP_LOSS_PCT
        value: "0.012"
      - key: DAY_TRADE_TAKE_PROFIT_PCT
        value: "0.024"
      - key: MAX_DAILY_LOSS_USD
        value: "35.0"
      - key: DAY_TRADE_EOD_FLATTEN_MINUTES_BEFORE_CLOSE
        value: "15"
      - key: ENABLE_SMART_MONEY
        value: "true"
      - key: SMART_MONEY_WEIGHT
        value: "0.20"
      - key: EQUIBLES_API_KEY
        value: "eq_1a4793cb907bc87e163c0b457166914a95c86e8e"
      - key: CONGRESS_INVESTS_URL
        value: "https://congressinfor-production.up.railway.app"
      - key: FINNHUB_API_KEY
        value: "db402p9r01qucqgihnrgdb402p9r01qucqgihns0"
      - key: TWELVE_DATA_API_KEY
        value: "fa5122e69e6346359095fec0581fb72d"
      - key: FMP_API_KEY
        value: "i2dkmxpEVNF4X5pln0XwwNk0wfwtf9oN"
