services:
  - type: web
    name: autonomous-trading-cockpit
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EXECUTION_MODE
        value: "live"
      - key: SIMULATION_MODE
        value: "false"
      - key: INITIAL_CAPITAL
        value: "10000.0"
      - key: FINNHUB_API_KEY
        sync: false
