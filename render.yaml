services:
  - type: web
    name: autonomous-trading-cockpit
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: EXECUTION_MODE
        value: "live"
      - key: SIMULATION_MODE
        value: "false"
      - key: INITIAL_CAPITAL
        value: "10000.0"
      - key: FINNHUB_API_KEY
        value: "da02ec1r01qgk75qq5v0da02ec1r01qgk75qq5vg"
      - key: MAX_CONCURRENT_POSITIONS
        value: "15"
      - key: MAX_PORTFOLIO_EXPOSURE_PCT
        value: "0.85"
      - key: MAX_POSITION_SIZE_USD
        value: "250.0"
      - key: ENABLE_DAY_TRADING
        value: "true"
      - key: DAY_TRADE_MAX_ACTIVE
        value: "8"
      - key: EXECUTION_LOOP_INTERVAL
        value: "5.0"
      - key: EQUIBLES_API_KEY
        value: "eq_1a4793cb907bc87e163c0b457166914a95c86e8e"
      - key: CONGRESS_INVESTS_URL
        value: "https://congressinfor-production.up.railway.app"
      - key: ENABLE_SMART_MONEY
        value: "true"
      - key: TWELVE_DATA_API_KEY
        value: "fa5122e69e6346359095fec0581fb72d"
      - key: FMP_API_KEY
        value: "i2dkmxpEVNF4X5pln0XwwNk0wfwtf9oN"
      - key: ALPHA_VANTAGE_API_KEY
        value: "P3I4HA7S9JQHFL8X"
      - key: TAVILY_API_KEY
        value: "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"
      - key: SERPAPI_API_KEY
        value: "572f3ee5596cb17ee970fd360dfc8a36e8b8cba99c27b88d6362db83f76b30db"
      - key: ANSPIRE_API_KEY
        value: "PrR9nw3YnOMTdmjk3uvA0yLOvoBuEAoD"
      - key: QUIVER_API_KEY
        sync: false
